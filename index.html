<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d2924">
    <title>حکم مستر - Hokm Master</title>
    
    <!-- Font Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/navigation.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/toasts.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/utilities.css">

    <style>
        /* استایل موقت برای تست */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeInUp 0.4s ease-out; }
        #app-loader.hidden { opacity: 0; pointer-events: none; transition: opacity 0.5s; }
    </style>
</head>
<body class="app-body theme-dark">
    <div id="app" class="app-container">
        
        <!-- Loader -->
        <div id="app-loader" class="app-loader">
            <div class="loader-content">
                <div class="loader-logo"><span class="loader-icon">🃏</span></div>
                <h1 class="loader-title">حکم مستر</h1>
                <p class="loader-subtitle">Hokm Master</p>
                <div class="loader-progress"><div class="loader-progress-bar"></div></div>
                <p class="loader-status">در حال بارگذاری...</p>
            </div>
        </div>

        <!-- Header -->
        <header id="app-header" class="app-header">
            <div class="header-content">
                <div class="header-right">
                    <button id="btn-menu" class="header-btn btn-icon" aria-label="منو"><span class="icon">☰</span></button>
                    <div class="header-brand">
                        <span class="brand-icon">🃏</span>
                        <span class="brand-text">حکم مستر</span>
                    </div>
                </div>
                <div class="header-left">
                    <button class="header-btn btn-coin"><span class="coin-icon">🪙</span><span class="coin-amount">۵,۰۰۰</span></button>
                    <button class="header-btn btn-gem"><span class="gem-icon">💎</span><span class="gem-amount">۱۵۰</span></button>
                    <button class="header-btn btn-profile"><span class="avatar avatar-small">👤</span></button>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <nav id="app-sidebar" class="app-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-user">
                    <span class="avatar avatar-large">👤</span>
                    <div class="sidebar-user-info">
                        <div class="sidebar-username">بازیکن مهمان</div>
                        <div class="sidebar-level">سطح ۱</div>
                    </div>
                </div>
                <button id="btn-close-sidebar" class="btn-icon" aria-label="بستن"><span class="icon">✕</span></button>
            </div>
            <div class="sidebar-content">
                <div class="sidebar-section">
                    <div class="sidebar-section-title">بازی</div>
                    <a href="#" class="sidebar-link" onclick="showToast('بازی سریع', 'info')"><span class="sidebar-icon">⚡</span><span class="sidebar-text">بازی سریع</span></a>
                    <a href="#" class="sidebar-link" onclick="showToast('بازی کلاسیک', 'info')"><span class="sidebar-icon">🎴</span><span class="sidebar-text">بازی کلاسیک</span></a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="app-main" class="app-main">
            <div id="screens-container" class="screens-container">
                
                <!-- Home Screen (Hardcoded for testing) -->
                <div id="home-screen" class="screen active" data-screen-name="home">
                    <div class="screen-content">
                        <section class="hero">
                            <div class="hero-background"></div>
                            <div class="hero-content">
                                <h1 class="hero-title">به حکم مستر خوش آمدید!</h1>
                                <p class="hero-subtitle">بازی حکم آنلاین با هوش مصنوعی پیشرفته و حالت‌های مختلف</p>
                                <button class="btn-quick-play" onclick="showToast('در حال جستجوی حریف...', 'success')">
                                    <span class="quick-play-icon">⚡</span>
                                    <div class="quick-play-text">
                                        <span class="quick-play-title">بازی سریع</span>
                                        <span class="quick-play-subtitle">شروع فوری بازی</span>
                                    </div>
                                    <span class="quick-play-arrow">←</span>
                                </button>
                            </div>
                        </section>

                        <section class="game-modes-section" style="margin-top: 2rem;">
                            <div class="section-header"><h2 class="section-title">حالت‌های بازی</h2></div>
                            <div class="game-modes-grid">
                                <button class="game-mode-card" onclick="showToast('حالت کلاسیک انتخاب شد', 'info')">
                                    <span class="mode-icon">🎴</span>
                                    <div class="mode-info"><h3 class="mode-title">کلاسیک</h3><p class="mode-description">بازی استاندارد حکم</p></div>
                                </button>
                                <button class="game-mode-card" onclick="showToast('حالت رقابتی انتخاب شد', 'info')">
                                    <span class="mode-icon">🏆</span>
                                    <div class="mode-info"><h3 class="mode-title">رقابتی</h3><p class="mode-description">کسب امتیاز و لیگ</p></div>
                                </button>
                                <button class="game-mode-card" onclick="showToast('اتاق خصوصی', 'info')">
                                    <span class="mode-icon">🏠</span>
                                    <div class="mode-info"><h3 class="mode-title">خصوصی</h3><p class="mode-description">بازی با دوستان</p></div>
                                </button>
                            </div>
                        </section>
                    </div>
                </div>

            </div>
            
            <!-- Toast Container -->
            <div id="toast-container" class="toast-container-main"></div>
        </main>

        <!-- Bottom Navigation -->
        <nav id="app-bottom-nav" class="app-bottom-nav">
            <a href="#" class="bottom-nav-item active" onclick="setActiveNav(this)"><span class="bottom-nav-icon">🏠</span><span class="bottom-nav-text">خانه</span></a>
            <a href="#" class="bottom-nav-item" onclick="setActiveNav(this); showToast('بازی', 'info')"><span class="bottom-nav-icon">⚡</span><span class="bottom-nav-text">بازی</span></a>
            <a href="#" class="bottom-nav-item" onclick="setActiveNav(this); showToast('فروشگاه', 'info')"><span class="bottom-nav-icon">🛒</span><span class="bottom-nav-text">فروشگاه</span></a>
            <a href="#" class="bottom-nav-item" onclick="setActiveNav(this); showToast('رتبه‌بندی', 'info')"><span class="bottom-nav-icon">🏆</span><span class="bottom-nav-text">رتبه</span></a>
            <a href="#" class="bottom-nav-item" onclick="setActiveNav(this); showToast('پروفایل', 'info')"><span class="bottom-nav-icon">👤</span><span class="bottom-nav-text">پروفایل</span></a>
        </nav>
    </div>

    <!-- Simple JS for Testing -->
    <script>
        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'var(--color-success)' : type === 'error' ? 'var(--color-danger)' : 'var(--color-primary)';
            toast.style.cssText = `display: flex; align-items: center; gap: 10px; padding: 12px 20px; background: ${bgColor}; color: white; border-radius: 8px; box-shadow: var(--shadow-dark-lg); margin-bottom: 8px; animation: fadeInUp 0.3s ease-out; font-weight: 500;`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : 'ℹ️'}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        // Hide Loader on Load
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('app-loader').classList.add('hidden');
                showToast('به حکم مستر خوش آمدید! 🃏', 'success');
            }, 800);
        });

        // Sidebar Toggle
        const sidebar = document.getElementById('app-sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }
        document.getElementById('btn-menu').addEventListener('click', toggleSidebar);
        document.getElementById('btn-close-sidebar').addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', toggleSidebar);

        // Bottom Nav Active State
        function setActiveNav(element) {
            document.querySelectorAll('.bottom-nav-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
