<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d2924">
    <title>حکم مستر - Hokm Master</title>
    
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="variables.css">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="typography.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="navigation.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="screens.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="game.css">
    <link rel="stylesheet" href="modals.css">
    <link rel="stylesheet" href="toasts.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="themes.css">
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="utilities.css">
</head>
<body class="theme-dark">
    <div id="app" class="app-container">
        
        <!-- Loader -->
        <div id="app-loader" class="app-loader">
            <div class="loader-logo">🃏</div>
            <h1>حکم مستر</h1>
            <p>در حال بارگذاری...</p>
        </div>

        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <button id="btn-menu" class="header-btn">☰</button>
                <div class="header-brand">
                    <span></span>
                    <span>حکم مستر</span>
                </div>
                <div class="header-currency">
                    <span>🪙 <span id="coins">5000</span></span>
                    <span>💎 <span id="gems">150</span></span>
                </div>
            </div>
        </header>

        <!-- Sidebar -->
        <div id="sidebar-overlay" class="sidebar-overlay"></div>
        <nav id="sidebar" class="app-sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <span class="avatar">👤</span>
                    <div>
                        <div class="username">مهمان</div>
                        <div class="level">سطح ۱</div>
                    </div>
                </div>
                <button id="btn-close-sidebar" class="btn-close">✕</button>
            </div>
            <div class="sidebar-content" id="sidebar-menu">
                <!-- Menu items will be loaded here -->
            </div>
        </nav>

        <!-- Main Content -->
        <main class="app-main">
            <div id="content" class="screen-content">
                <!-- Dynamic content loads here -->
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="app-bottom-nav">
            <button class="nav-item active" data-screen="home">
                <span>🏠</span>
                <span>خانه</span>
            </button>
            <button class="nav-item" data-screen="game">
                <span>⚡</span>
                <span>بازی</span>
            </button>
            <button class="nav-item" data-screen="shop">
                <span>🛒</span>
                <span>فروشگاه</span>
            </button>
            <button class="nav-item" data-screen="leaderboard">
                <span>🏆</span>
                <span>رتبه</span>
            </button>
            <button class="nav-item" data-screen="profile">
                <span>👤</span>
                <span>پروفایل</span>
            </button>
        </nav>

        <!-- Toast Container -->
        <div id="toast-container"></div>
    </div>

    <!-- Main App Script -->
    <script>
        // ============================================
        // HOKM MASTER - COMPLETE APPLICATION
        // ============================================

        // Application State
        const AppState = {
            currentUser: {
                name: 'مهمان',
                level: 1,
                coins: 5000,
                gems: 150,
                gamesPlayed: 0,
                gamesWon: 0
            },
            currentScreen: 'home',
            sidebarOpen: false
        };

        // Screen Contents (HTML Templates)
        const Screens = {
            home: `
                <div class="hero-section">
                    <div class="hero-content">
                        <h1>به حکم مستر خوش آمدید!</h1>
                        <p>بازی حکم آنلاین با هوش مصنوعی پیشرفته</p>
                        <button class="btn-primary btn-large" onclick="App.navigate('quick-play')">
                            ⚡ بازی سریع
                        </button>
                    </div>
                </div>
                
                <div class="game-modes">
                    <h2>حالت‌های بازی</h2>
                    <div class="modes-grid">
                        <div class="mode-card" onclick="App.navigate('classic')">
                            <span class="mode-icon">🎴</span>
                            <h3>کلاسیک</h3>
                            <p>بازی استاندارد حکم</p>
                        </div>
                        <div class="mode-card" onclick="App.navigate('ranked')">
                            <span class="mode-icon">🏆</span>
                            <h3>رقابتی</h3>
                            <p>کسب امتیاز و لیگ</p>
                        </div>
                        <div class="mode-card" onclick="App.navigate('private')">
                            <span class="mode-icon"></span>
                            <h3>خصوصی</h3>
                            <p>بازی با دوستان</p>
                        </div>
                        <div class="mode-card" onclick="App.navigate('practice')">
                            <span class="mode-icon">🎓</span>
                            <h3>تمرین</h3>
                            <p>تمرین با هوش مصنوعی</p>
                        </div>
                    </div>
                </div>

                <div class="stats-section">
                    <h2>آمار شما</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <span class="stat-icon">🎮</span>
                            <span class="stat-value" id="stat-games">0</span>
                            <span class="stat-label">بازی</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-icon">🏆</span>
                            <span class="stat-value" id="stat-wins">0</span>
                            <span class="stat-label">برد</span>
                        </div>
                        <div class="stat-card">
                            <span class="stat-icon">⭐</span>
                            <span class="stat-value" id="stat-winrate">0%</span>
                            <span class="stat-label">نرخ برد</span>
                        </div>
                    </div>
                </div>
            `,

            game: `
                <div class="screen-header">
                    <h1>انتخاب حالت بازی</h1>
                </div>
                <div class="options-list">
                    <button class="option-card" onclick="App.navigate('quick-play')">
                        <span class="option-icon"></span>
                        <div class="option-info">
                            <h3>بازی سریع</h3>
                            <p>شروع فوری بازی</p>
                        </div>
                    </button>
                    <button class="option-card" onclick="App.navigate('classic')">
                        <span class="option-icon">🎴</span>
                        <div class="option-info">
                            <h3>بازی کلاسیک</h3>
                            <p>حالت استاندارد</p>
                        </div>
                    </button>
                    <button class="option-card" onclick="App.navigate('ranked')">
                        <span class="option-icon">🏆</span>
                        <div class="option-info">
                            <h3>رقابتی</h3>
                            <p>بازی برای امتیاز</p>
                        </div>
                    </button>
                </div>
            `,

            shop: `
                <div class="screen-header">
                    <h1>فروشگاه</h1>
                </div>
                <div class="shop-items">
                    <div class="shop-item">
                        <span class="item-icon">💎</span>
                        <div class="item-info">
                            <h3>۱۰ الماس</h3>
                            <p>ارز премиум بازی</p>
                        </div>
                        <button class="btn-buy">خرید</button>
                    </div>
                </div>
            `,

            leaderboard: `
                <div class="screen-header">
                    <h1>رتبه‌بندی</h1>
                </div>
                <div class="leaderboard-list">
                    <div class="leader-item">
                        <span class="rank">۱</span>
                        <span class="player-name">بازیکن برتر</span>
                        <span class="player-score">۲۵۰۰</span>
                    </div>
                </div>
            `,

            profile: `
                <div class="screen-header">
                    <h1>پروفایل</h1>
                </div>
                <div class="profile-info">
                    <div class="avatar-large">👤</div>
                    <h2>${AppState.currentUser.name}</h2>
                    <p>سطح ${AppState.currentUser.level}</p>
                </div>
            `,

            'quick-play': `
                <div class="game-lobby">
                    <h1>بازی سریع</h1>
                    <p>در حال جستجوی حریف...</p>
                    <div class="loading-spinner"></div>
                    <button class="btn-secondary" onclick="App.navigate('home')">انصراف</button>
                </div>
            `,

            classic: `
                <div class="game-setup">
                    <h1>بازی کلاسیک</h1>
                    <p>تنظیمات بازی</p>
                    <button class="btn-primary" onclick="App.startGame('classic')">شروع بازی</button>
                </div>
            `,

            ranked: `
                <div class="game-setup">
                    <h1>بازی رقابتی</h1>
                    <p>کسب امتیاز و صعود در لیگ</p>
                    <button class="btn-primary" onclick="App.startGame('ranked')">شروع بازی</button>
                </div>
            `,

            private: `
                <div class="game-setup">
                    <h1>اتاق خصوصی</h1>
                    <input type="text" placeholder="کد اتاق را وارد کنید" class="input-field">
                    <button class="btn-primary">پیوستن</button>
                    <button class="btn-secondary">ساخت اتاق</button>
                </div>
            `,

            practice: `
                <div class="game-setup">
                    <h1>تمرین</h1>
                    <p>بازی با هوش مصنوعی</p>
                    <button class="btn-primary" onclick="App.startGame('practice')">شروع تمرین</button>
                </div>
            `
        };

        // Sidebar Menu Items
        const MenuItems = {
            game: [
                { id: 'quick-play', icon: '⚡', text: 'بازی سریع' },
                { id: 'classic', icon: '🎴', text: 'بازی کلاسیک' },
                { id: 'ranked', icon: '🏆', text: 'بازی رقابتی' },
                { id: 'private', icon: '🏠', text: 'اتاق خصوصی' },
                { id: 'practice', icon: '', text: 'تمرین' },
                { id: 'tournament', icon: '🏅', text: 'تورنمنت' }
            ],
            progress: [
                { id: 'league', icon: '🏅', text: 'لیگ' },
                { id: 'season', icon: '📅', text: 'فصل' },
                { id: 'missions', icon: '🎯', text: 'مأموریت‌ها' },
                { id: 'achievements', icon: '', text: 'دستاوردها' },
                { id: 'statistics', icon: '📊', text: 'آمار' }
            ],
            social: [
                { id: 'friends', icon: '👥', text: 'دوستان' },
                { id: 'chat', icon: '💬', text: 'چت' },
                { id: 'leaderboard', icon: '🏆', text: 'رتبه‌بندی' },
                { id: 'events', icon: '🎪', text: 'رویدادها' }
            ],
            account: [
                { id: 'profile', icon: '👤', text: 'پروفایل' },
                { id: 'inventory', icon: '🎒', text: 'موجودی' },
                { id: 'shop', icon: '🛒', text: 'فروشگاه' },
                { id: 'settings', icon: '⚙️', text: 'تنظیمات' },
                { id: 'help', icon: '❓', text: 'راهنما' }
            ]
        };

        // Main Application
        const App = {
            init() {
                this.cacheDOM();
                this.bindEvents();
                this.renderSidebar();
                this.navigate('home');
                this.updateStats();
                this.hideLoader();
            },

            cacheDOM() {
                this.dom = {
                    loader: document.getElementById('app-loader'),
                    content: document.getElementById('content'),
                    sidebar: document.getElementById('sidebar'),
                    sidebarMenu: document.getElementById('sidebar-menu'),
                    sidebarOverlay: document.getElementById('sidebar-overlay'),
                    btnMenu: document.getElementById('btn-menu'),
                    btnCloseSidebar: document.getElementById('btn-close-sidebar'),
                    navItems: document.querySelectorAll('.nav-item'),
                    coins: document.getElementById('coins'),
                    gems: document.getElementById('gems')
                };
            },

            bindEvents() {
                // Sidebar toggle
                this.dom.btnMenu.addEventListener('click', () => this.toggleSidebar());
                this.dom.btnCloseSidebar.addEventListener('click', () => this.toggleSidebar());
                this.dom.sidebarOverlay.addEventListener('click', () => this.toggleSidebar());

                // Bottom navigation
                this.dom.navItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        const screen = e.currentTarget.dataset.screen;
                        this.navigate(screen);
                        
                        // Update active state
                        this.dom.navItems.forEach(nav => nav.classList.remove('active'));
                        e.currentTarget.classList.add('active');
                    });
                });
            },

            renderSidebar() {
                let html = '';
                
                for (const [category, items] of Object.entries(MenuItems)) {
                    html += `<div class="sidebar-section">`;
                    html += `<div class="section-title">${this.getCategoryTitle(category)}</div>`;
                    
                    items.forEach(item => {
                        html += `
                            <button class="sidebar-item" onclick="App.navigate('${item.id}'); App.toggleSidebar()">
                                <span class="item-icon">${item.icon}</span>
                                <span class="item-text">${item.text}</span>
                            </button>
                        `;
                    });
                    
                    html += `</div>`;
                }
                
                this.dom.sidebarMenu.innerHTML = html;
            },

            getCategoryTitle(category) {
                const titles = {
                    game: 'بازی',
                    progress: 'پیشرفت',
                    social: 'اجتماعی',
                    account: 'حساب'
                };
                return titles[category] || category;
            },

            navigate(screenId) {
                AppState.currentScreen = screenId;
                
                if (Screens[screenId]) {
                    this.dom.content.innerHTML = Screens[screenId];
                    this.dom.content.classList.remove('fade-in');
                    void this.dom.content.offsetWidth; // Trigger reflow
                    this.dom.content.classList.add('fade-in');
                } else {
                    this.showToast(`صفحه ${screenId} به زودی...`, 'info');
                }

                // Close sidebar if open
                if (AppState.sidebarOpen) {
                    this.toggleSidebar();
                }
            },

            toggleSidebar() {
                AppState.sidebarOpen = !AppState.sidebarOpen;
                this.dom.sidebar.classList.toggle('open', AppState.sidebarOpen);
                this.dom.sidebarOverlay.classList.toggle('active', AppState.sidebarOpen);
            },

            startGame(mode) {
                this.showToast(`شروع بازی ${mode}...`, 'success');
                setTimeout(() => {
                    this.showToast('به زودی...', 'info');
                }, 1000);
            },

            updateStats() {
                const winrate = AppState.currentUser.gamesPlayed > 0 
                    ? Math.round((AppState.currentUser.gamesWon / AppState.currentUser.gamesPlayed) * 100)
                    : 0;
                
                const gamesEl = document.getElementById('stat-games');
                const winsEl = document.getElementById('stat-wins');
                const winrateEl = document.getElementById('stat-winrate');
                
                if (gamesEl) gamesEl.textContent = AppState.currentUser.gamesPlayed;
                if (winsEl) winsEl.textContent = AppState.currentUser.gamesWon;
                if (winrateEl) winrateEl.textContent = winrate + '%';
            },

            showToast(message, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                
                const colors = {
                    success: 'var(--color-success)',
                    error: 'var(--color-danger)',
                    warning: 'var(--color-warning)',
                    info: 'var(--color-primary)'
                };
                
                const icons = {
                    success: '✅',
                    error: '❌',
                    warning: '⚠️',
                    info: 'ℹ️'
                };
                
                toast.className = 'toast';
                toast.style.cssText = `
                    display: flex;
                    align-items: center;
                    gap: 10px;
                    padding: 12px 20px;
                    background: ${colors[type]};
                    color: white;
                    border-radius: 8px;
                    box-shadow: var(--shadow-lg);
                    margin-bottom: 8px;
                    animation: slideIn 0.3s ease;
                    font-weight: 500;
                `;
                
                toast.innerHTML = `
                    <span>${icons[type]}</span>
                    <span>${message}</span>
                `;
                
                container.appendChild(toast);
                
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    setTimeout(() => toast.remove(), 300);
                }, 2500);
            },

            hideLoader() {
                setTimeout(() => {
                    this.dom.loader.classList.add('hidden');
                    this.showToast('به حکم مستر خوش آمدید! 🃏', 'success');
                }, 800);
            }
        };

        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });

        // Add CSS animation
        const style = document.createElement('style');
        style.textContent = `
            .fade-in {
                animation: fadeIn 0.4s ease-out;
            }
            
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            @keyframes slideIn {
                from { opacity: 0; transform: translateY(-20px); }
                to { opacity: 1; transform: translateY(0); }
            }
            
            .toast {
                position: fixed;
                top: 80px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 10000;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
